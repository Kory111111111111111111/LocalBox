<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LocalToolBox — 316 free browser utilities. Files stay on your device: PDF, image, video, text, developer, math and more. No signup, no uploads, no watermarks."
    />
    <meta name="color-scheme" content="dark light" />
    <title>LocalToolBox — Local tools. Your device.</title>
    <script>
      try {
        var t = localStorage.getItem("ltb-theme");
        if (t) {
          document.documentElement.setAttribute("data-theme", t);
          var light = {
            "default-light": 1,
            "nord-light": 1,
            "gruvbox-light": 1,
            "catppuccin-latte": 1,
            "tokyo-night-day": 1,
            "dracula-light": 1
          };
          var appearance = light[t] ? "light" : "dark";
          document.documentElement.setAttribute("data-appearance", appearance);
          document.documentElement.style.colorScheme = appearance;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
